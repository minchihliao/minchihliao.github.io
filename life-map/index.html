<h1>人生地圖</h1>
<p>人生地圖是一個個人用的目標與行事曆工具，把長期目標、專案、每天的事項與行事曆放在同一個地方。</p>
<p>連結 Google 日曆後，可以在人生地圖裡看到自己的 Google 日曆行程，並把選定的行程寫回自己的 Google 日曆。</p>
